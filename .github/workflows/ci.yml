name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Testes unitários
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build (checagem de compilação)
        run: go build ./...

      - name: Testes unitários
        run: go test ./... -v -cover

      - name: Checagem de compilação (Linux amd64/arm64)
        shell: pwsh
        run: |
          $env:GOOS="linux"; $env:CGO_ENABLED="0"
          $env:GOARCH="amd64"; go build ./...
          $env:GOARCH="arm64"; go build ./...

      - name: Checagem de compilação (macOS amd64/arm64)
        shell: pwsh
        run: |
          $env:GOOS="darwin"; $env:CGO_ENABLED="0"
          $env:GOARCH="amd64"; go build ./...
          $env:GOARCH="arm64"; go build ./...
