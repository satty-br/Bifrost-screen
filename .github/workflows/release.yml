name: Gerar versão

# Roda os testes, compila o bifrost.exe com a versão informada,
# sobe o .exe como artefato e abre um PR com o bump de versão pronto pra revisar.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Nova versão (ex.: 1.2.0)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  gerar-versao:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Testes unitários
        run: go test ./... -v -cover

      - name: Compila bifrost.exe ${{ inputs.version }}
        shell: cmd
        run: build.bat ${{ inputs.version }}

      - name: Compila binários Linux e macOS ${{ inputs.version }}
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          $ldflags = "-s -w -X main.version=${{ inputs.version }}"
          $env:GOOS="linux";  $env:GOARCH="amd64"; go build -trimpath -ldflags $ldflags -o dist/bifrost-linux-amd64 ./cmd/bifrost
          $env:GOOS="linux";  $env:GOARCH="arm64"; go build -trimpath -ldflags $ldflags -o dist/bifrost-linux-arm64 ./cmd/bifrost
          $env:GOOS="darwin"; $env:GOARCH="amd64"; go build -trimpath -ldflags $ldflags -o dist/bifrost-darwin-amd64 ./cmd/bifrost
          $env:GOOS="darwin"; $env:GOARCH="arm64"; go build -trimpath -ldflags $ldflags -o dist/bifrost-darwin-arm64 ./cmd/bifrost

      - name: Atualiza o arquivo VERSION
        shell: pwsh
        run: Set-Content -Path VERSION -Value "${{ inputs.version }}" -NoNewline

      - name: Renomeia o binário do Windows (convenção usada pelo autoupdate)
        shell: pwsh
        run: Move-Item dist/bifrost.exe dist/bifrost-windows-amd64.exe

      - name: Gera checksums.txt (SHA-256, conferido pelo autoupdate)
        shell: pwsh
        run: |
          Set-Location dist
          $files = "bifrost-windows-amd64.exe","bifrost-linux-amd64","bifrost-linux-arm64","bifrost-darwin-amd64","bifrost-darwin-arm64"
          $files | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $_" } | Set-Content -Path checksums.txt -Encoding ascii

      - name: Cria o release v${{ inputs.version }} no GitHub (com os binários anexados)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ inputs.version }}" `
            dist/bifrost-windows-amd64.exe dist/bifrost-linux-amd64 dist/bifrost-linux-arm64 dist/bifrost-darwin-amd64 dist/bifrost-darwin-arm64 dist/checksums.txt `
            --title "Bifrost v${{ inputs.version }}" `
            --notes "Release automático da versão ${{ inputs.version }}. Veja o histórico de commits para detalhes."

      - name: Sobe os binários como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-${{ inputs.version }}
          path: |
            dist/bifrost-windows-amd64.exe
            dist/bifrost-linux-amd64
            dist/bifrost-linux-arm64
            dist/bifrost-darwin-amd64
            dist/bifrost-darwin-arm64
            dist/checksums.txt

      - name: Abre o PR com a nova versão
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: versão ${{ inputs.version }}"
          branch: release/v${{ inputs.version }}
          title: "Versão ${{ inputs.version }}"
          body: |
            Pipeline automática (`Gerar versão`):

            - ✅ Testes unitários passaram
            - ✅ Binários ${{ inputs.version }} compilados para Windows, Linux (amd64/arm64) e macOS (amd64/arm64)
            - 🚀 Release publicado: https://github.com/satty-br/Bifrost-screen/releases/tag/v${{ inputs.version }} (binários + `checksums.txt`, usado pela checagem automática de atualização do app)
            - 📦 `VERSION` e `cmd/bifrost/rsrc_windows_amd64.syso` atualizados (ícone/manifesto/versão do .exe)

            Revise e faça merge para manter o `VERSION` do repositório em dia.
          labels: release
