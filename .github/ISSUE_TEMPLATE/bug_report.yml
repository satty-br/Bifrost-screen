name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please don't use this
        template for security vulnerabilities — see [SECURITY.md](https://github.com/satty-br/Bifrost-screen/blob/main/SECURITY.md) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
      placeholder: Tell us what you saw and what you expected.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the panel
        2. Go to ...
        3. Click ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Bifrost version
      placeholder: e.g. 1.0.0 (see the panel's General tab, or the release you downloaded)
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >
        If possible, run `bifrost --diagnostico` (or `bifrost.exe --diagnostico`
        on Windows) and paste the contents of the generated `diagnostico.txt`
        here (check it for anything sensitive before pasting).
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
